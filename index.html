<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Birthday Surprise ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts -->
    <div class="floating-hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💞</span>
        <span>❤️</span>
        <span>💗</span>
    </div>

    <!-- Main section -->
    <div class="container">

        <!-- Heart -->
        <div class="heart"></div>

        <!-- Main message -->
        <h1 class="birthday-text">
            Advance Happy Birthday ❤️
        </h1>

        <p class="sub-text">
            Your special day is coming soon! 🎂✨
        </p>

        <!-- Button -->
        <button id="surpriseBtn">
            Click Me ❤️
        </button>

        <!-- Surprise -->
        <div id="surprise" class="surprise">

            <h2>
                🎉 Advance Birthday Surprise! 🎉
            </h2>

            <p>
                Wishing you lots of love, happiness,
                success and beautiful memories! ❤️✨
            </p>

            <div class="big-heart">
                ❤️
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
